<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAG arXiv Abstracts - IR26A</title>
<style>
  :root {
    --bg: #0f1117;
    --panel: #1a1d27;
    --panel2: #22263400;
    --border: #2c3040;
    --text: #e7e9ee;
    --muted: #9aa0ac;
    --accent: #6ea8fe;
    --user-bubble: #2b4a8a;
    --bot-bubble: #1f2330;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 16px; margin: 0; }
  header p { font-size: 12px; color: var(--muted); margin: 4px 0 0; }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
  }
  .msg { margin-bottom: 18px; display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 12px;
    line-height: 1.45;
    font-size: 14px;
    white-space: pre-wrap;
  }
  .msg.user .bubble { background: var(--user-bubble); }
  .msg.bot .bubble { background: var(--bot-bubble); border: 1px solid var(--border); }

  .evidencia {
    margin-top: 10px;
    border-top: 1px dashed var(--border);
    padding-top: 8px;
  }
  .evidencia summary {
    cursor: pointer;
    font-size: 12px;
    color: var(--accent);
  }
  .doc {
    margin-top: 8px;
    padding: 8px 10px;
    background: #14161f;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 12px;
  }
  .doc .titulo { font-weight: 600; color: var(--text); }
  .doc .meta { color: var(--muted); margin-top: 2px; }
  .doc .abstract { margin-top: 6px; color: #c4c8d2; }

  form {
    display: flex;
    gap: 10px;
    padding: 16px 20px;
    border-top: 1px solid var(--border);
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
  }
  input {
    flex: 1;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 14px;
  }
  button {
    padding: 12px 18px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: #0f1117;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  .loading { color: var(--muted); font-size: 13px; font-style: italic; }
</style>
</head>
<body>
<header>
  <h1>Chat RAG sobre arXiv Paper Abstracts</h1>
  <p>Recuperación semántica + re-ranking con LLM + generación con evidencia (Groq / Llama 3.3 70B) — IR26A</p>
</header>

<div id="chat"></div>

<form id="form">
  <input id="pregunta" type="text" placeholder="Escribe tu pregunta sobre papers de arXiv..." autocomplete="off" />
  <button id="enviar" type="submit">Enviar</button>
</form>

<script>
const chat = document.getElementById("chat");
const form = document.getElementById("form");
const input = document.getElementById("pregunta");
const boton = document.getElementById("enviar");

function agregarMensaje(texto, quien) {
  const div = document.createElement("div");
  div.className = "msg " + quien;
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = texto;
  div.appendChild(bubble);
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return bubble;
}

function agregarEvidencia(bubble, evidencia) {
  if (!evidencia || evidencia.length === 0) return;
  const details = document.createElement("details");
  details.className = "evidencia";
  const summary = document.createElement("summary");
  summary.textContent = `Ver evidencia (${evidencia.length} fragmentos recuperados)`;
  details.appendChild(summary);

  evidencia.forEach(doc => {
    const d = document.createElement("div");
    d.className = "doc";
    d.innerHTML = `
      <div class="titulo">${doc.titulo}</div>
      <div class="meta">${doc.doc_id} · categorías: ${doc.categorias} · similitud coseno: ${doc.similitud}</div>
      <div class="abstract">${doc.abstract}...</div>
    `;
    details.appendChild(d);
  });
  bubble.appendChild(details);
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const pregunta = input.value.trim();
  if (!pregunta) return;

  agregarMensaje(pregunta, "user");
  input.value = "";
  boton.disabled = true;

  const bubbleBot = agregarMensaje("Buscando en el corpus y generando respuesta...", "bot");
  bubbleBot.classList.add("loading");

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ pregunta }),
    });
    const datos = await res.json();
    bubbleBot.classList.remove("loading");

    if (!res.ok) {
      bubbleBot.textContent = "Error: " + (datos.error || "algo salió mal.");
      return;
    }

    bubbleBot.textContent = datos.respuesta;
    agregarEvidencia(bubbleBot, datos.evidencia);
  } catch (err) {
    bubbleBot.classList.remove("loading");
    bubbleBot.textContent = "Error de conexión: " + err.message;
  } finally {
    boton.disabled = false;
    input.focus();
  }
});
</script>
</body>
</html>
